name: Build and publish g0v0 Veldrid

on:
  push:
    branches: [main, master, 'feature/**']
    tags: ['v*-g0v0.*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Select package version
        id: version
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ($env:REF_TYPE -eq 'tag') {
            if ($env:REF_NAME -notmatch '^v\d+\.\d+\.\d+-g0v0\.\d+$') { throw 'Invalid release tag' }
            $version = $env:REF_NAME.Substring(1)
          } else {
            $version = '4.9.0-g0v0.ci.' + $env:GITHUB_RUN_NUMBER
          }
          "value=$version" >> $env:GITHUB_OUTPUT
      - name: Build and pack (no tests or GPU probes)
        shell: pwsh
        run: |
          dotnet pack src/Veldrid.sln -c Release -warnaserror -p:NoWarn=1591 -p:G0V0PackageVersion=${{ steps.version.outputs.value }} -o artifacts
          if ($LASTEXITCODE -ne 0) { throw 'Pack failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/g0v0.*.nupkg
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'GooGuTeam/g0v0-veldrid'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: artifacts
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Detect publishing credentials
        id: credentials
        env:
          API_KEY: ${{ secrets.NUGET_API_KEY }}
          NUGET_USER: ${{ secrets.NUGET_USER }}
        run: |
          if [ -n "$API_KEY" ]; then
            echo 'api_key=true' >> "$GITHUB_OUTPUT"
          elif [ -z "$NUGET_USER" ]; then
            echo 'Configure NUGET_API_KEY or NuGet trusted publishing with NUGET_USER.' >&2
            exit 1
          fi
      - uses: NuGet/login@v1
        id: login
        if: steps.credentials.outputs.api_key != 'true'
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish fork packages only
        env:
          NUGET_KEY: ${{ secrets.NUGET_API_KEY || steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push 'artifacts/g0v0.*.nupkg' --api-key "$NUGET_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: artifacts/g0v0.*.nupkg
